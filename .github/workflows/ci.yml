name: checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev,analysis]'
      - run: ruff check src tests experiments/local experiments/baselines experiments/alignment
      - run: ruff format --check src tests experiments/local experiments/baselines experiments/alignment
      - run: python -m unittest discover -s tests -v
      - run: bash hpc/scripts/selftest.sh
      - run: python -m build
